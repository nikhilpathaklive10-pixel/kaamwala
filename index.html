<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087a53">

<title>KaamWala - Local Services</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#17211b;
}

.wrap{
  max-width:720px;
  margin:auto;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#087a53,#0aa56e);
  color:white;
  padding:22px 18px 28px;
  border-radius:0 0 26px 26px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.15);
}

.logo{
  width:88px;
  height:88px;
  object-fit:contain;
  background:white;
  border-radius:20px;
  padding:7px;
  margin-bottom:8px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:7px 0 0;
  font-size:15px;
  opacity:.95;
}

/* SEARCH */
.search{
  margin:-20px 16px 18px;
  background:white;
  padding:12px;
  border-radius:17px;
  box-shadow:0 4px 16px rgba(0,0,0,.12);
}

.search input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

/* CONTENT */
section{
  padding:0 16px;
}

h2{
  font-size:20px;
  margin:20px 0 12px;
}

/* SERVICES */
.cats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.cat{
  background:white;
  border:0;
  border-radius:15px;
  padding:15px 7px;
  font-size:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  cursor:pointer;
}

.cat:active{
  transform:scale(.97);
}

.cat b{
  display:block;
  font-size:27px;
  margin-bottom:6px;
}

/* WORKERS */
.workers{
  padding:0 16px 100px;
}

.card{
  background:white;
  border-radius:17px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.name{
  font-weight:bold;
  font-size:19px;
}

.meta{
  color:#65736b;
  font-size:14px;
  margin-top:7px;
}

.btns{
  display:flex;
  gap:9px;
  margin-top:13px;
}

.btn{
  flex:1;
  text-align:center;
  text-decoration:none;
  padding:11px 8px;
  border-radius:11px;
  font-size:14px;
  font-weight:bold;
}

.call{
  background:#e7f7ef;
  color:#087547;
}

.wa{
  background:#e7f7ed;
  color:#168443;
}

/* REGISTER */
#register{
  display:none;
  padding:0 16px 100px;
}

.note{
  background:#fff4cf;
  padding:13px;
  border-radius:12px;
  font-size:13px;
  margin-bottom:14px;
}

#register input{
  width:100%;
  padding:14px;
  margin-bottom:11px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

.save{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#087a53;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* BOTTOM */
.bottom{
  position:fixed;
  z-index:10;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px 16px;
  box-shadow:0 -3px 14px rgba(0,0,0,.12);
}

.reg{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#087a53;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* EMPTY */
.empty{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  color:#66736b;
}

/* MOBILE */
@media(max-width:430px){

  .cats{
    grid-template-columns:repeat(2,1fr);
  }

  header h1{
    font-size:27px;
  }

}
</style>
</head>

<body>

<div class="wrap">

<!-- HEADER -->
<header>

<img
class="logo"
src="file_00000000049c821185beb83ff4c207ab.png"
alt="KaamWala Logo">

<h1>KaamWala</h1>

<p>Apne area ka trusted worker aasani se paaiye</p>

</header>


<!-- SEARCH -->
<div class="search">

<input
id="search"
type="text"
placeholder="Worker, kaam ya area search karein..."
oninput="render()">

</div>


<!-- HOME -->
<section id="home">

<h2>Service चुनें</h2>

<div class="cats">

<button class="cat" onclick="filterCat('Plumber')">
<b>🔧</b>
Plumber
</button>

<button class="cat" onclick="filterCat('Electrician')">
<b>⚡</b>
Electrician
</button>

<button class="cat" onclick="filterCat('Carpenter')">
<b>🪚</b>
Carpenter
</button>

<button class="cat" onclick="filterCat('Painter')">
<b>🎨</b>
Painter
</button>

<button class="cat" onclick="filterCat('Mason')">
<b>🧱</b>
Mason
</button>

<button class="cat" onclick="filterCat('Mechanic')">
<b>🏍️</b>
Mechanic
</button>

</div>

<h2>Available Workers</h2>

</section>


<!-- WORKERS -->
<div id="workers" class="workers"></div>


<!-- REGISTER -->
<section id="register">

<h2>Worker Registration</h2>

<div class="note">
Apni details bhar kar KaamWala par worker ke roop mein register karein.
</div>

<input
id="rname"
type="text"
placeholder="Worker ka naam">

<input
id="rservice"
type="text"
placeholder="Kaam - Plumber, Electrician etc.">

<input
id="rphone"
type="tel"
placeholder="Mobile number">

<input
id="rlocation"
type="text"
placeholder="Area / Address">

<button class="save" onclick="saveWorker()">
Register Worker
</button>

</section>


<!-- BOTTOM BUTTON -->
<div class="bottom">

<button class="reg" onclick="showRegister()">
➕ Worker Register Karein
</button>

</div>

</div>


<script>

let workers = JSON.parse(
localStorage.getItem("kaamwala_workers") || "[]"
);

let selectedCategory = "";


/* SAVE WORKER */
function saveWorker(){

const name =
document.getElementById("rname").value.trim();

const service =
document.getElementById("rservice").value.trim();

const phone =
document.getElementById("rphone").value.trim();

const location =
document.getElementById("rlocation").value.trim();


if(!name || !service || !phone || !location){

alert("Kripya sabhi details bhariye.");

return;

}


workers.push({

name:name,
service:service,
phone:phone,
location:location

});


localStorage.setItem(
"kaamwala_workers",
JSON.stringify(workers)
);


alert("Worker successfully registered!");


document.getElementById("rname").value="";
document.getElementById("rservice").value="";
document.getElementById("rphone").value="";
document.getElementById("rlocation").value="";


showHome();

render();

}


/* SHOW WORKERS */
function render(){

const search =
document.getElementById("search")
.value
.toLowerCase()
.trim();

const box =
document.getElementById("workers");

box.innerHTML="";


const list = workers.filter(worker=>{

const text =
(
worker.name+" "+
worker.service+" "+
worker.location
).toLowerCase();


const searchMatch =
!search || text.includes(search);


const categoryMatch =
!selectedCategory ||
worker.service
.toLowerCase()
.includes(
selectedCategory.toLowerCase()
);


return searchMatch && categoryMatch;

});


if(list.length===0){

box.innerHTML=`

<div class="empty">

<strong>Abhi koi worker nahi mila</strong>

<br><br>

Naam, kaam ya area se search karke dekhein.

</div>

`;

return;

}


list.forEach(worker=>{

const phone =
worker.phone.replace(/\D/g,"");


box.innerHTML += `

<div class="card">

<div class="name">
${escapeHTML(worker.name)}
</div>

<div class="meta">
🔧 ${escapeHTML(worker.service)}
</div>

<div class="meta">
📍 ${escapeHTML(worker.location)}
</div>

<div class="btns">

<a
class="btn"
href="#"
onclick="viewProfile('${phone}');return false;">
👤 Profile
</a>

<a
class="btn call"
href="tel:${phone}">
📞 Call
</a>

<a
class="btn wa"
href="https://wa.me/91${phone}"
target="_blank">
💬 WhatsApp
</a>

</div>
</div>

</div>

`;

});

}


/* CATEGORY */
function filterCat(category){

selectedCategory = category;

document.getElementById("search").value="";

render();

window.scrollTo({

top:document.getElementById("workers").offsetTop,

behavior:"smooth"

});

}


/* REGISTER PAGE */
function showRegister(){

document.getElementById("home")
.style.display="none";

document.getElementById("workers")
.style.display="none";

document.getElementById("register")
.style.display="block";

window.scrollTo(0,0);

}


/* HOME PAGE */
function showHome(){

document.getElementById("home")
.style.display="block";

document.getElementById("workers")
.style.display="block";

document.getElementById("register")
.style.display="none";

window.scrollTo(0,0);

}


/* SECURITY */
function escapeHTML(text){

return text

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
function viewProfile(phone){
  const worker = workers.find(
    w => w.phone.replace(/\D/g,"") === phone
  );

  if(!worker){
    alert("Worker profile nahi mila.");
    return;
  }

  const reviewKey = "kaamwala_reviews_" + phone;

let reviews = JSON.parse(
  localStorage.getItem(reviewKey) || "[]"
);

let average = 0;

if(reviews.length > 0){
  average =
    reviews.reduce((sum, r) => sum + r.rating, 0) /
    reviews.length;
}

let reviewText =
  "👤 Worker Profile\n\n" +
  "Naam: " + worker.name + "\n" +
  "Kaam: " + worker.service + "\n" +
  "📍 Area: " + worker.location + "\n" +
  "📞 Phone: " + worker.phone + "\n\n" +
  "⭐ Rating: " +
  (reviews.length ? average.toFixed(1) : "No rating yet") +
  "\n" +
  "💬 Reviews: " + reviews.length;

if(reviews.length > 0){

  reviewText += "\n\nRecent Reviews:\n";

  reviews.slice(-3).reverse().forEach((r, i) => {
    reviewText +=
      "\n⭐ " + r.rating + "/5 - " +
      r.text;
  });
}

alert(reviewText);

if(confirm("⭐ Kya aap is worker ko Rating & Review dena chahte hain?")){

  let rating = prompt(
    "⭐ Rating दें (1 से 5 तक):"
  );

  rating = Number(rating);

  if(!rating || rating < 1 || rating > 5){

    alert("कृपया 1 से 5 के बीच Rating दें।");

  }else{

    let review = prompt(
      "✍️ अपना Review लिखें:"
    );

    if(review && review.trim()){

      reviews.push({
        rating: rating,
        text: review.trim(),
        date: new Date().toLocaleDateString("hi-IN")
      });

      localStorage.setItem(
        reviewKey,
        JSON.stringify(reviews)
      );

      alert(
        "✅ आपका Rating & Review save हो गया!\n\n" +
        "⭐ Rating: " + rating + "/5\n" +
        "✍️ Review: " + review
      );
    }
  }
  }
  }

/* START */
render();

</script>

</body>
</html>
